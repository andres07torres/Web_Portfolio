version: "3.8"

services:

  # ── Aplicación Django ────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portafolio_web
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py shell -c \"from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'Tigre6788')\" &&
             gunicorn portafolio.wsgi:application --bind 0.0.0.0:8000 --timeout 120"
    env_file:
      - .env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"
    networks:
      - portafolio_net
      - supabase_net

  # ── Nginx (reverse proxy + archivos estáticos) ───────────────
  nginx:
    image: nginx:alpine
    container_name: portafolio_nginx
    restart: always
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    networks:
      - portafolio_net
      - dokploy-network

# ── Volúmenes persistentes ────────────────────────────────────
volumes:
  media_data:
  static_data:

# ── Redes ──────────────────────────────────────────────────────
networks:
  portafolio_net:
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network
  supabase_net:
    external: true
    name: supabase-supabase-hzjipt_default
