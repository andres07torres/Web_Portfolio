{% extends 'base.html' %}
{% load static %}

{% block content %}
<div id="sobre-mi" class="lazy-section" data-url="{% url 'section_sobre_mi' %}">
    <section class="pt-3 pb-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <div class="skeleton skel-title mb-4"></div>
                    <div class="skeleton skel-sub mb-4"></div>
                    <div class="skeleton" style="width:100%;height:60px;margin-bottom:16px;"></div>
                    <div class="skeleton" style="width:100%;height:60px;margin-bottom:16px;"></div>
                </div>
                <div class="col-lg-5 offset-lg-1 mt-4 mt-lg-5">
                    <div class="skeleton" style="width:70%;height:250px;margin:0 auto;border-radius:16px;"></div>
                    <div class="skeleton mt-4" style="width:100%;height:200px;border-radius:16px;"></div>
                </div>
            </div>
        </div>
    </section>
</div>

<div id="experiencia" class="lazy-section" data-url="{% url 'section_experiencia' %}">
    <section class="py-5">
        <div class="container">
            <div class="skeleton skel-title mb-4"></div>
            <div class="skeleton skel-sub mb-5"></div>
            <div class="position-relative" style="min-height:300px;">
                <div style="position:absolute;left:20px;top:0;width:2px;height:100%;background:rgba(255,255,255,0.05);border-radius:2px;"></div>
                <div class="skeleton skel-timeline-card"></div>
                <div class="skeleton skel-timeline-card"></div>
            </div>
        </div>
    </section>
</div>

<div id="proyectos" class="lazy-section" data-url="{% url 'section_proyectos' %}">
    <section class="py-5">
        <div class="container">
            <div class="skeleton skel-title mb-4"></div>
            <div class="skeleton skel-sub mb-5"></div>
            <div class="skel-grid-row">
                <div class="skeleton skel-grid-card"></div>
                <div class="skeleton skel-grid-card"></div>
                <div class="skeleton skel-grid-card"></div>
            </div>
        </div>
    </section>
</div>

<div id="contacto" class="lazy-section" data-url="{% url 'section_contacto' %}">
    <section class="py-4 py-md-5">
        <div class="container text-center">
            <div class="skeleton skel-title mb-4" style="margin:0 auto;"></div>
            <div class="skeleton skel-sub mb-5" style="margin:0 auto;"></div>
            <div class="skel-form">
                <div class="skeleton skel-input"></div>
                <div class="skeleton skel-input"></div>
                <div class="skeleton skel-textarea"></div>
                <div class="skeleton skel-btn"></div>
            </div>
        </div>
    </section>
</div>
{% endblock %}
