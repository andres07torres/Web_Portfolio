<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Nuevo mensaje de contacto</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #ffffff;">
    <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #0a0a0a; padding: 40px 20px;">
        <tr>
            <td align="center">
                <!-- Contenedor Principal -->
                <table width="100%" max-width="600" border="0" cellspacing="0" cellpadding="0" style="max-width: 600px; background-color: #121212; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden;">
                    <!-- Cabecera -->
                    <tr>
                        <td style="padding: 30px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05);">
                            <h1 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: bold;">
                                Nuevo mensaje de <span style="color: #00d4ff;">Contacto</span>
                            </h1>
                        </td>
                    </tr>
                    
                    <!-- Cuerpo -->
                    <tr>
                        <td style="padding: 40px 30px;">
                            <table width="100%" border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td style="padding-bottom: 20px;">
                                        <p style="margin: 0 0 5px 0; font-size: 13px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px;">Nombre</p>
                                        <p style="margin: 0; font-size: 16px; font-weight: 500; color: #ffffff;">{{ nombre }}</p>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding-bottom: 25px;">
                                        <p style="margin: 0 0 5px 0; font-size: 13px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px;">Correo electrónico</p>
                                        <p style="margin: 0; font-size: 16px;">
                                            <a href="mailto:{{ email }}" style="color: #00d4ff; text-decoration: none; font-weight: 500;">{{ email }}</a>
                                        </p>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <p style="margin: 0 0 10px 0; font-size: 13px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px;">Mensaje</p>
                                        <div style="background-color: rgba(255,255,255,0.03); padding: 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
                                            <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #e0e0e0; white-space: pre-wrap;">{{ mensaje }}</p>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Pie de página -->
                    <tr>
                        <td style="padding: 20px 30px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); background-color: rgba(0,0,0,0.2);">
                            <p style="margin: 0; font-size: 12px; color: rgba(255,255,255,0.4);">
                                Este mensaje fue enviado desde el formulario de contacto de tu portafolio.
                            </p>
                            <p style="margin: 8px 0 0 0; font-size: 12px; color: rgba(255,255,255,0.2);">
                                &copy; Andr3sDev7
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
